services:

  activemq:
    image: apache/activemq-classic:6.1.7
    container_name: camel-activemq
    ports:
      - "61616:61616"
      - "8161:8161"
    environment:
      ACTIVEMQ_ADMIN_LOGIN: admin
      ACTIVEMQ_ADMIN_PASSWORD: admin
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: camel-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: camel-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: camel_db
      MYSQL_USER: camel
      MYSQL_PASSWORD: camel123
      MYSQL_ROOT_PASSWORD: root123
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data: